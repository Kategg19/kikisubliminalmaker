color: c.pass ? \"#3f9d6d\" : \"#d4646a\"\n        }))\n      } : null;\n      pv.encoded = !!(r && r.encoded);\n      pv.modes = MODES.map(m => ({\n        label: m.label,\n        bg: m.key === s.previewMode ? accent : \"#fff\",\n        border: m.key === s.previewMode ? accent : \"#ffdcec\",\n        fg: m.key === s.previewMode ? \"#fff\" : \"#c9558c\",\n        pick: () => this.setState({ previewMode: m.key })\n      }));\n      pv.modeNote = (MODES.filter(m => m.key === s.previewMode)[0] || MODES[0]).note;\n    }\n\n    const ar = s.anaResult;\n    const ana = ar ? {\n      sr: ar.sr + \" hz\", nyquist: Math.round(ar.nyquist) + \" hz\",\n      channels: ar.channels === 1 ? \"mono\" : ar.channels + \" ch\",\n      duration: ar.duration.toFixed(1) + \" s\",\n      low: Math.round(ar.low) + \" hz\", high: Math.round(ar.high) + \" hz\",\n      peakHz: Math.round(ar.peakHz) + \" hz\",\n      peak: ar.glitch.peak.toFixed(3),\n      clip: ar.glitch.clipPct.toFixed(3) + \"%\",\n      dc: ar.glitch.dc.toFixed(5),\n      at17500: (ar.low >= 17480 && ar.low <= 18200)\n        ? \"yes — this is a 17500 hz sub ♡ nothing sits below the carrier\"\n        : \"no — energy starts at \" + Math.round(ar.low) + \" hz\",\n      at17500Color: (ar.low >= 17480 && ar.low <= 18200) ? \"#3f9d6d\" : \"#d4646a\",\n      bands: ar.bands.map(b => ({\n        name: b.name, pct: b.pct.toFixed(1) + \"%\",\n        width: Math.max(1, Math.min(100, b.pct)) + \"%\",\n        color: b.pct > 50 ? \"#ff5fa2\" : \"#ffc2dc\"\n      }))\n    } : null;\n\n    const vt = s.tracks.filter(t => t.id === s.verdictId && t.report)[0];\n    let verdict = null;\n    if (vt) {\n      const r = vt.report;\n      verdict = r.ok ? {\n        title: \"it's perfect ♡\",\n        color: \"#3f9d6d\",\n        lines: [\n          \"i checked the whole file and it came back clean. your carrier is \" + Math.round(r.cf) + \" hz exactly, just like you set it.\",\n          \"no clipping, no dropouts, no dc offset. this one is ready to loop.\"\n        ],\n        cta: \"play it ♡\", retry: false\n      } : {\n        title: r.encoded ? \"close, but let's redo it\" : \"hmm — start over, babe\",\n        color: \"#d4646a\",\n        lines: [\n          r.encoded\n            ? \"the encode is in there, but some checks came back unhappy: \" + r.failedNames.join(\", \") + \".\"\n            : \"i couldn't find a proper band in this one — the ultrasonic energy is too weak to call it encoded.\",\n          \"convert it again — if it fails twice, your source recording is probably too quiet, too short, or has no speech in it.\"\n        ],\n        cta: \"close and retry\", retry: true\n      };\n    }\n\n    const tracks = s.tracks.map(t => ({\n      id: t.id, name: t.name, status: t.status, url: t.url, outName: t.outName,\n      ready: t.state === \"done\",\n      badge: t.state === \"done\" ? \"♡ok\" : (t.state === \"error\" ? \"hmm\" : \"wav\"),\n      statusColor: t.state === \"done\" ? \"#3f9d6d\" : (t.state === \"error\" ? \"#d4646a\" : \"#ad86a0\"),\n      remove: () => this.setState(st => ({ tracks: st.tracks.filter(x => x.id !== t.id) })),\n      pick: () => { if (t.url) this.setState({ previewId: t.id, previewMode: \"encoded\" }); }\n    }));\n\n    return {\n      tutorialOpen: s.tutorialOpen,\n      step: { title: step.title, lines: step.lines, tip: step.tip },\n      dots: STEPS.map((_, i) => ({ size: i === s.step ? \"11px\" : \"8px\", color: i === s.step ? accent : \"#ffd7e8\" })),\n      nextLabel: s.step === STEPS.length - 1 ? \"let's go ♡\" : \"next\",\n      nextStep: () => {\n        if (s.step === STEPS.length - 1) { this.skipTutorialFn(); return; }\n        this.setState({ step: s.step + 1 });\n      },\n      prevStep: () => this.setState({ step: Math.max(0, s.step - 1) }),\n      skipTutorial: () => this.skipTutorialFn(),\n      openTutorial: () => this.setState({ tutorialOpen: true, step: 0 }),\n\n      dropBg: s.dragging ? \"#ffeef6\" : \"#fffdfe\",\n      onDragOver: (e) => { e.preventDefault(); if (!s.dragging) this.setState({ dragging: true }); },\n      onDragLeave: () => this.setState({ dragging: false }),\n      onDrop: (e) => { e.preventDefault(); this.setState({ dragging: false }); this.addFiles(e.dataTransfer.files); },\n      onPick: (e) => { this.addFiles(e.target.files); e.target.value = \"\"; },\n\n      tracks, hasTracks: tracks.length > 0, noTracks: tracks.length === 0,\n      convertAll: () => this.convertAll(),\n      busy: s.busy, busyLabel: s.busyLabel,\n\n      rates: [44100, 48000, 96000].map(r => ({\n        label: (r / 1000).toFixed(r === 44100 ? 1 : 0) + \" k\",\n        bg: r === s.sampleRate ? accent : \"#fff\",\n        border: r === s.sampleRate ? accent : \"#ffdcec\",\n        fg: r === s.sampleRate ? \"#fff\" : \"#c9558c\",\n        pick: () => this.setState({ sampleRate: r })\n      })),\n      rateNote: \"project rate \" + s.sampleRate + \" hz · nyquist \" + (s.sampleRate / 2) + \" hz\",\n      carrier: s.carrier,\n      carrierLabel: (s.carrier + (s.engine === \"am\" ? s.offset : 0)) + \" hz\",\n      setCarrier: (e) => this.setState({ carrier: Number(e.target.value) }),\n      lockExact: () => this.setState({ carrier: 17500, offset: 0 }),\n      exactLabel: (s.carrier === 17500 && !(s.engine === \"am\" && s.offset))\n        ? \"locked to exactly 17500 hz ♡\" : \"snap back to exactly 17500 hz\",\n\n      engines: [\n        { key: \"ssb\", name: \"ssb — exact\", sub: \"band starts at the carrier\" },\n        { key: \"am\", name: \"am — plug-in\", sub: \"sidebands either side\" }\n      ].map(e => ({\n        name: e.name, sub: e.sub,\n        bg: s.engine === e.key ? accent : \"#fff\",\n        border: s.engine === e.key ? accent : \"#ffdcec\",\n        fg: s.engine === e.key ? \"#fff\" : \"#c9558c\",\n        subFg: s.engine === e.key ? \"#ffe3ef\" : \"#c2a3b7\",\n        pick: () => this.setState({ engine: e.key, offset: e.key === \"am\" ? 80 : 0 })\n      })),\n      engineNote: s.engine === \"am\"\n        ? \"paul wadsworth's original: your voice is multiplied by a \" + (s.carrier + s.offset) + \" hz tone, which mirrors it into sidebands above and below. the effective carrier is carrier + offset.\"\n        : \"single sideband. your voice is shifted bodily upward so the band opens at exactly \" + s.carrier + \" hz with nothing below it. no offset needed.\",\n      isAm: s.engine === \"am\", isSsb: s.engine === \"ssb\",\n      offset: s.offset, offsetLabel: \"+\" + s.offset + \" hz\",\n      setOffset: (e) => this.setState({ offset: Number(e.target.value) }),\n      depth: s.depth, depthLabel: s.depth.toFixed(2),\n      setDepth: (e) => this.setState({ depth: Number(e.target.value) }),\n      effectiveLabel: (s.carrier + (s.engine === \"am\" ? s.offset : 0)) + \" hz\",\n      outDb: s.outDb, outDbLabel: (s.outDb > 0 ? \"+\" : \"\") + s.outDb + \" db\",\n      setOutDb: (e) => this.setState({ outDb: Number(e.target.value) }),\n      windowLabel: Math.round(win.lo) + \" – \" + Math.round(win.hi) + \" hz, centred \" + Math.round(win.cf),\n      speed: s.speed, speedLabel: s.speed.toFixed(1) + \"×\",\n      setSpeed: (e) => this.setState({ speed: Number(e.target.value) }),\n      keepAudible: s.keepAudible,\n      toggleAudible: (e) => this.setState({ keepAudible: e.target.checked }),\n      squeakFix: () => this.squeakPreset(),\n\n      canvasRef: this.canvasRef,\n      audioRef: this.audioRef,\n      onPlay: () => { this.attachAnalyser(); this.setState({ playing: true }); },\n      onPause: () => { this.stopSpectrum(); this.setState({ playing: false }); },\n      previewUrl: pv.url, previewName: pv.name, noPreview: !pv.url,\n      modes: pv.modes, modeNote: pv.modeNote,\n      report: pv.report, hasReport: !!pv.report,\n      canPlay: pv.encoded, cannotPlay: !!pv.url && !pv.encoded,\n      playLabel: s.playing ? \"■  stop loop\" : \"▶  play on loop\",\n      togglePlay: () => {\n        const el = this.el(\"audio\");\n        if (!el) return;\n        if (el.paused) { el.loop = true; el.play(); this.setState({ playing: true }); }\n        else { el.pause(); this.setState({ playing: false }); }\n      },\n      verdict, hasVerdict: !!verdict,\n      closeVerdict: () => this.setState({ verdictId: \"\" }),\n      retryVerdict: () => this.setState({ verdictId: \"\" }),\n\n      styles: STYLES.map((st, i) => ({\n        name: st.name,\n        bg: i === s.styleIdx ? accent : \"#fff\",\n        border: i === s.styleIdx ? accent : \"#ffdcec\",\n        fg: i === s.styleIdx ? \"#fff\" : \"#c9558c\",\n        pick: () => this.setState({ styleIdx: i })\n      })),\n      styleNote: styleDef.note,\n      starters: styleDef.starters.map(text => ({\n        text,\n        add: () => this.setState(st => ({ script: st.script ? st.script.replace(/\\s*$/, \"\") + \"\\n\" + text : text }))\n      })),\n      script: s.script,\n      setScript: (e) => this.setState({ script: e.target.value }),\n      lineCount: (s.script ? s.script.split(\"\\n\").filter(l => l.trim()).length : 0) + \" lines\",\n      speak: () => this.speak(),\n      speakLabel: s.speaking ? \"stop ♡\" : \"read it to me ♡\",\n      downloadScript: () => {\n        const blob = new Blob([s.script || \"\"], { type: \"text/plain\" });\n        const a = document.createElement(\"a\");\n        a.href = URL.createObjectURL(blob);\n        a.download = \"affirmations.txt\";\n        a.click();\n      },\n\n      onRsPick: (e) => { this.resampleFile(e.target.files && e.target.files[0]); e.target.value = \"\"; },\n      rsName: s.rsName, rsBusy: s.rsBusy, rsUrl: s.rsUrl, hasRs: !!(s.rsUrl && s.rsInfo),\n      rsRates: [44100, 48000, 96000].map(r => ({\n        label: r === 44100 ? \"44100\" : (r === 48000 ? \"48000\" : \"96000\"),\n        sub: r === 44100 ? \"cd\" : (r === 48000 ? \"standard\" : \"hi-res\"),\n        bg: r === s.rsRate ? accent : \"#fff\",\n        border: r === s.rsRate ? accent : \"#ffdcec\",\n        fg: r === s.rsRate ? \"#fff\" : \"#c9558c\",\n        subFg: r === s.rsRate ? \"#ffe3ef\" : \"#c2a3b7\",\n        pick: () => this.setState({ rsRate: r }, () => this._rsSource && this.doResample())\n      })),\n      rsDepths: [16, 24, 32].map(d => ({\n        label: d === 32 ? \"32 float\" : d + \" bit\",\n        bg: d === s.rsDepth ? accent : \"#fff\",\n        border: d === s.rsDepth ? accent : \"#ffdcec\",\n        fg: d === s.rsDepth ? \"#fff\" : \"#c9558c\",\n        pick: () => this.setState({ rsDepth: d }, () => this._rsSource && this.doResample())\n      })),\n      rsInfo: s.rsInfo ? {\n        from: s.rsInfo.fromRate + \" hz\",\n        to: s.rsInfo.toRate + \" hz\",\n        depth: s.rsInfo.depth === 32 ? \"32-bit float\" : s.rsInfo.depth + \"-bit pcm\",\n        channels: s.rsInfo.channels === 1 ? \"mono\" : s.rsInfo.channels + \" ch\",\n        duration: s.rsInfo.duration.toFixed(2) + \" s\",\n        size: this.sizeLabel(s.rsInfo.size),\n        name: s.rsInfo.name,\n        change: s.rsInfo.toRate === s.rsInfo.fromRate ? \"unchanged\"\n          : (s.rsInfo.toRate > s.rsInfo.fromRate ? \"upsampled\" : \"downsampled\")\n      } : null,\n\n      onAnaPick: (e) => { this.analyseFile(e.target.files && e.target.files[0]); e.target.value = \"\"; },\n      anaName: s.anaName, anaBusy: s.anaBusy, hasAna: !!ana, noAna: !ana && !s.anaBusy,\n      ana,\n\n      mixRows: s.tracks.map(t => {\n        const db = s.mixGain[t.id] === undefined ? 0 : s.mixGain[t.id];\n        const muted = !!s.mixMute[t.id];\n        return {\n          name: t.name, db, dbLabel: (db > 0 ? \"+\" : \"\") + db + \" db\",\n          rowOpacity: muted ? \"0.45\" : \"1\",\n          muteBg: muted ? \"#ff5fa2\" : \"#fff\",\n          muteFg: muted ? \"#fff\" : \"#c9558c\",\n          muteLabel: muted ? \"muted\" : \"mute\",\n          setDb: (e) => {\n            const v = Number(e.target.value);\n            this.setState(st => ({ mixGain: Object.assign({}, st.mixGain, { [t.id]: v }) }));\n          },\n          toggleMute: () => this.set
