document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"31e41a24-2c08-4ebd-b732-c50463f8f576\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\">\n<style>\nhtml,body{margin:0;padding:0}\nbody{background:#fffafc;color:#5a3346;font-family:Trebuchet MS,Verdana,sans-serif}\na{color:#e0509a;text-decoration:none}\na:hover{color:#b83a76}\nimg{image-rendering:pixelated}\n@keyframes kk-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}\n@keyframes kk-bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}\n@keyframes kk-twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}\n@keyframes kk-wave{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}\n@keyframes kk-spin{to{transform:rotate(360deg)}}\ninput[type=range]{accent-color:#ff5fa2}\n::selection{background:#ffd0e4}\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#fffafc;background-image:radial-gradient(#ffe0ee 1.5px,transparent 1.6px),radial-gradient(#fff2f7 1.5px,transparent 1.6px);background-size:26px 26px,26px 26px;background-position:0 0,13px 13px;font-family:Trebuchet MS,Verdana,sans-serif;color:#5a3346;padding-bottom:70px\">\n\n  <sc-if value=\"{{ tutorialOpen }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed;inset:0;z-index:60;background:rgba(255,214,233,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px\">\n      <div style=\"width:min(720px,100%);background:#fff;border:3px solid #ffb3d4;border-radius:26px;box-shadow:0 18px 0 rgba(255,143,191,.22),0 0 0 6px #fff6fa;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:linear-gradient(#fff2f8,#ffe6f1);border-bottom:2px dashed #ffc2dc\">\n          <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.06em;color:#e0509a\">♡ tutorial ♡<\u002Fspan>\n          <button sc-camel-on-click=\"{{ skipTutorial }}\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;background:#fff;border:2px solid #ffc2dc;color:#c9558c;border-radius:999px;padding:5px 12px;cursor:pointer\">skip<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:170px 1fr;gap:22px;padding:26px 28px 20px;align-items:start\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n            <img src=\"a013bd12-0202-4ee6-99e2-b280a35a7233\" alt=\"Kiki\" style=\"width:150px;height:150px;object-fit:contain;border-radius:20px;background:#fff;border:2px solid #ffdcec;animation:kk-float 3.4s ease-in-out infinite\">\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:#e0509a\">kiki<\u002Fspan>\n            <span style=\"font-size:11px;color:#a8809a;text-align:center;line-height:1.4\">subliminal maker<br>♡ law of assumption ♡<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"min-height:230px;display:flex;flex-direction:column\">\n            <h2 style=\"margin:0 0 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;line-height:1.5;color:#c9407e\">{{ step.title }}<\u002Fh2>\n            <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14.5px;line-height:1.72;color:#6b4055;text-wrap:pretty\">\n              <sc-for list=\"{{ step.lines }}\" as=\"line\" hint-placeholder-count=\"3\">\n                <p style=\"margin:0\">{{ line }}<\u002Fp>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ step.tip }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:14px;display:flex;gap:10px;align-items:flex-start;background:#fff8fb;border:2px dashed #ffc2dc;border-radius:16px;padding:11px 14px\">\n                <img src=\"b15c97a2-dae5-4c23-8f9f-e39386bdb6af\" alt=\"\" style=\"width:34px;height:34px;object-fit:contain;flex:none;animation:kk-bob 2.8s ease-in-out infinite\">\n                <span style=\"font-size:13px;line-height:1.6;color:#b8577f\">{{ step.tip }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 24px 20px\">\n          <div style=\"display:flex;gap:7px;align-items:center\">\n            <sc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"5\">\n              <span style=\"width:{{ d.size }};height:{{ d.size }};border-radius:999px;background:{{ d.color }};display:inline-block\"><\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px\">\n            <button sc-camel-on-click=\"{{ prevStep }}\" style=\"font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;font-size:13px;background:#fff;border:2px solid #ffc2dc;color:#c9558c;border-radius:999px;padding:9px 20px;cursor:pointer\">back<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ nextStep }}\" style=\"font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;font-size:13px;background:#ff6faa;border:2px solid #ff4d94;color:#fff;border-radius:999px;padding:9px 24px;cursor:pointer;box-shadow:0 4px 0 #ff4d94\">{{ nextLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasVerdict }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed;right:22px;bottom:22px;z-index:70;width:min(370px,calc(100vw - 44px));background:#fff;border:3px solid #ffb3d4;border-radius:22px;box-shadow:0 14px 0 rgba(255,143,191,.22),0 0 0 5px #fff6fa;padding:18px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;gap:12px;align-items:flex-start\">\n        <img src=\"a013bd12-0202-4ee6-99e2-b280a35a7233\" alt=\"Kiki\" style=\"width:64px;height:64px;object-fit:contain;flex:none;border-radius:14px;background:#fff8fb;animation:kk-bob 3s ease-in-out infinite\">\n        <div style=\"min-width:0;display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;color:{{ verdict.color }}\">{{ verdict.title }}<\u002Fspan>\n          <sc-for list=\"{{ verdict.lines }}\" as=\"l\" hint-placeholder-count=\"2\">\n            <p style=\"margin:0;font-size:12.5px;line-height:1.65;color:#6b4055;text-wrap:pretty\">{{ l }}<\u002Fp>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:9px;justify-content:flex-end\">\n        <button sc-camel-on-click=\"{{ closeVerdict }}\" style=\"font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;font-size:12.5px;background:#fff;border:2px solid #ffc2dc;color:#c9558c;border-radius:999px;padding:9px 16px;cursor:pointer\">close<\u002Fbutton>\n        <sc-if value=\"{{ verdict.retry }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ retryVerdict }}\" style=\"font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;font-size:12.5px;background:#ff6faa;border:2px solid #ff4d94;color:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;box-shadow:0 3px 0 #ff4d94\">{{ verdict.cta }}<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <header style=\"max-width:1080px;margin:0 auto;padding:34px 24px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px\">\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <img src=\"b0cde584-7e8a-40b6-aaa1-d4727eeabd1f\" alt=\"\" style=\"width:64px;height:64px;object-fit:contain;animation:kk-bob 3s ease-in-out infinite\">\n      <h1 style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:27px;line-height:1.3;color:#e0509a;text-shadow:2px 2px 0 #ffe0ee\">kiki's 17500hz studio<\u002Fh1>\n      <img src=\"b0cde584-7e8a-40b6-aaa1-d4727eeabd1f\" alt=\"\" style=\"width:64px;height:64px;object-fit:contain;animation:kk-bob 3s ease-in-out infinite reverse\">\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:15px;color:#a8809a;max-width:560px;line-height:1.65\">drop in any audio ♡ it comes back at a 17500 hz ultrasonic carrier, 48000 hz sample rate, ready to loop while you sleep<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:6px\">\n      <a href=\"#studio\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;background:#fff;border:2px solid #ffc2dc;border-radius:999px;padding:8px 14px;color:#c9558c\">converter<\u002Fa>\n      <a href=\"#freqcheck\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;background:#fff;border:2px solid #ffc2dc;border-radius:999px;padding:8px 14px;color:#c9558c\">frequency check<\u002Fa>\n      <a href=\"#mixer\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;background:#fff;border:2px solid #ffc2dc;border-radius:999px;padding:8px 14px;color:#c9558c\">mix &amp; render<\u002Fa>\n      <a href=\"#resample\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;background:#fff;border:2px solid #ffc2dc;border-radius:999px;padding:8px 14px;color:#c9558c\">sample rate<\u002Fa>\n      <a href=\"#affirmations\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;background:#fff;border:2px solid #ffc2dc;border-radius:999px;padding:8px 14px;color:#c9558c\">affirmations<\u002Fa>\n      <a href=\"#askkiki\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;background:#fff;border:2px solid #ffc2dc;border-radius:999px;padding:8px 14px;color:#c9558c\">ask kiki<\u002Fa>\n      <button sc-camel-on-click=\"{{ openTutorial }}\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;background:#ffeaf4;border:2px solid #ffc2dc;border-radius:999px;padding:8px 14px;color:#c9558c;cursor:pointer\">replay tutorial<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"studio\" style=\"max-width:1080px;margin:0 auto;padding:26px 24px 0;scroll-margin-top:20px\">\n    <div style=\"display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:start\">\n\n      <div style=\"background:#fff;border:3px solid #ffd7e8;border-radius:24px;padding:22px;box-shadow:0 10px 0 rgba(255,183,214,.2)\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:14px\">\n          <span style=\"width:9px;height:9px;border-radius:999px;background:#ff5fa2;display:inline-block\"><\u002Fspan>\n          <h2 style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#c9407e\">1. add your audio<\u002Fh2>\n        <\u002Fdiv>\n\n        <label style=\"display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 20px;border:3px dashed #ffbcda;border-radius:20px;background:{{ dropBg }};cursor:pointer;text-align:center\" sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drag-leave=\"{{ onDragLeave }}\" sc-camel-on-drop=\"{{ onDrop }}\">\n          <img src=\"b15c97a2-dae5-4c23-8f9f-e39386bdb6af\" alt=\"\" style=\"width:56px;height:56px;object-fit:contain;animation:kk-float 3.2s ease-in-out infinite\">\n          <span style=\"font-weight:700;font-size:15px;color:#c9558c\">drop files here or click to browse<\u002Fspan>\n          <span style=\"font-size:12px;color:#ad86a0;line-height:1.6\">mp3 · wav · mp4 · m4a · aac · alac · flac · ogg · opus · webm<br>as many at once as you like ♡<\u002Fspan>\n          <input type=\"file\" accept=\"audio/*,video/mp4,video/webm,.flac,.m4a,.alac,.aac,.opus,.wav,.mp3,.aiff,.aif\" multiple=\"\" sc-camel-on-change=\"{{ onPick }}\" style=\"display:none\">\n        <\u002Flabel>\n\n        <div style=\"display:flex;align-items:center;gap:9px;margin:22px 0 12px\">\n          <span style=\"width:9px;height:9px;border-radius:999px;background:#ff5fa2;display:inline-block\"><\u002Fspan>\n          <h2 style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#c9407e\">2. your files<\u002Fh2>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasTracks }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ tracks }}\" as=\"t\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ t.pick }}\" style=\"display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:#fff8fb;border:2px solid #ffdcec;border-radius:16px;padding:11px 13px;cursor:pointer\">\n                <div style=\"width:44px;height:44px;border-radius:12px;background:#ffeaf4;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9px;color:#e0509a\">{{ t.badge }}<\u002Fdiv>\n                <div style=\"min-width:0;display:flex;flex-direction:column;gap:3px\">\n                  <span style=\"font-weight:700;font-size:13.5px;color:#6b4055;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ t.name }}<\u002Fspan>\n                  <span style=\"font-size:11.5px;color:{{ t.statusColor }}\">{{ t.status }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:8px;align-items:center\">\n                  <sc-if value=\"{{ t.ready }}\" hint-placeholder-val=\"{{ true }}\">\n                    <a href=\"{{ t.url }}\" download=\"{{ t.outName }}\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9px;background:#ff6faa;border:2px solid #ff4d94;color:#fff;border-radius:999px;padding:7px 12px;box-shadow:0 3px 0 #ff4d94\">save wav<\u002Fa>\n                  <\u002Fsc-if>\n                  <button sc-camel-on-click=\"{{ t.remove }}\" style=\"background:#fff;border:2px solid #ffc2dc;color:#c9558c;border-radius:999px;width:28px;height:28px;cursor:pointer;font-size:13px;line-height:1\">×<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noTracks }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:0;font-size:13px;color:#b99ab0;background:#fff8fb;border:2px dashed #ffdcec;border-radius:16px;padding:16px;text-align:center\">nothing here yet — kiki is waiting ♡<\u002Fp>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;align-items:center;gap:9px;margin:22px 0 12px\">\n          <span style=\"width:9px;height:9px;border-radius:999px;background:#ff5fa2;display:inline-block\"><\u002Fspan>\n          <h2 style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#c9407e\">3. sprinkle it ♡<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n          <button sc-camel-on-click=\"{{ convertAll }}\" style=\"font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;font-size:15px;background:#ff5fa2;border:3px solid #ff3d88;color:#fff;border-radius:999px;padding:13px 28px;cursor:pointer;box-shadow:0 5px 0 #ff3d88\" style-hover=\"background:#ff7fb6\">convert to {{ carrierLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ busy }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"display:flex;align-items:center;gap:9px;font-size:13px;color:#c9558c;font-weight:600\">\n              <span style=\"width:16px;height:16px;border:3px solid #ffd7e8;border-top-color:#ff5fa2;border-radius:999px;display:inline-block;animation:kk-spin .8s linear infinite\"><\u002Fspan>\n              {{ busyLabel }}\n            <\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <p style=\"margin:12px 0 0;font-size:12px;color:#b99ab0;line-height:1.6\">everything is processed right here in your browser — nothing is uploaded anywhere.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <div style=\"background:#fff;border:3px solid #ffd7e8;border-radius:24px;padding:20px;box-shadow:0 10px 0 rgba(255,183,214,.2)\">\n          <h2 style=\"margin:0 0 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#c9407e\">settings<\u002Fh2>\n\n          <span style=\"font-size:13px;font-weight:600;color:#6b4055;display:block;margin-bottom:7px\">project sample rate<\u002Fspan>\n          <div style=\"display:flex;gap:7px;margin-bottom:6px\">\n            <sc-for list=\"{{ rates }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ r.pick }}\" style=\"flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;background:{{ r.bg }};border:2px solid {{ r.border }};color:{{ r.fg }};border-radius:12px;padding:9px 4px;cursor:pointer\">{{ r.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 16px;font-size:11.5px;color:#b99ab0;line-height:1.55\">{{ rateNote }} — everything is resampled to this rate before encoding, like setting the project rate in audacity. 44100 is the minimum the encoder allows.<\u002Fp>\n\n          <span style=\"font-size:13px;font-weight:600;color:#6b4055;display:block;margin-bottom:7px\">engine<\u002Fspan>\n          <div style=\"display:flex;gap:7px;margin-bottom:8px\">\n            <sc-for list=\"{{ engines }}\" as=\"e\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ e.pick }}\" style=\"flex:1;display:flex;flex-direction:column;gap:2px;align-items:center;font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;background:{{ e.bg }};border:2px solid {{ e.border }};color:{{ e.fg }};border-radius:14px;padding:10px 4px;cursor:pointer\">\n                <span style=\"font-size:11.5px\">{{ e.name }}<\u002Fspan>\n                <span style=\"font-size:9.5px;font-weight:600;color:{{ e.subFg }};line-height:1.3\">{{ e.sub }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 16px;font-size:11.5px;color:#b99ab0;line-height:1.55\">{{ engineNote }}<\u002Fp>\n\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px\">\n            <span style=\"font-size:13px;font-weight:600;color:#6b4055\">carrier<\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#e0509a\">{{ carrierLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" min=\"16000\" max=\"19000\" step=\"50\" value=\"{{ carrier }}\" sc-camel-on-change=\"{{ setCarrier }}\" sc-camel-on-input=\"{{ setCarrier }}\" style=\"width:100%;margin:0 0 12px\">\n\n          <sc-if value=\"{{ isAm }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px\">\n                <span style=\"font-size:13px;font-weight:600;color:#6b4055\">safety offset<\u002Fspan>\n                <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#e0509a\">{{ offsetLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <input type=\"range\" min=\"0\" max=\"200\" step=\"5\" value=\"{{ offset }}\" sc-camel-on-change=\"{{ setOffset }}\" sc-camel-on-input=\"{{ setOffset }}\" style=\"width:100%;margin:0 0 12px\">\n\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px\">\n                <span style=\"font-size:13px;font-weight:600;color:#6b4055\">modulation depth<\u002Fspan>\n                <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#e0509a\">{{ depthLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <input type=\"range\" min=\"0.3\" max=\"0.8\" step=\"0.05\" value=\"{{ depth }}\" sc-camel-on-change=\"{{ setDepth }}\" sc-camel-on-input=\"{{ setDepth }}\" style=\"width:100%;margin:0 0 8px\">\n\n              <p style=\"margin:0 0 12px;font-size:11.5px;color:#b99ab0;line-height:1.55\">effective carrier — <span style=\"color:#c9558c;font-weight:700\">{{ effectiveLabel }}<\u002Fspan>. set offset to 0 if you want it to land on 17500 exactly.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <button sc-camel-on-click=\"{{ lockExact }}\" style=\"width:100%;font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;font-size:12px;background:#fff8fb;border:2px solid #ffdcec;color:#c9558c;border-radius:12px;padding:9px;cursor:pointer;margin:0 0 14px\">{{ exactLabel }}<\u002Fbutton>\n\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px\">\n            <span style=\"font-size:13px;font-weight:600;color:#6b4055\">output gain<\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#e0509a\">{{ outDbLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" min=\"-24\" max=\"6\" step=\"1\" value=\"{{ outDb }}\" sc-camel-on-change=\"{{ setOutDb }}\" sc-camel-on-input=\"{{ setOutDb }}\" style=\"width:100%;margin:0 0 6px\">\n          <p style=\"margin:0 0 14px;font-size:11.5px;color:#b99ab0;line-height:1.55\">carrier window: <span style=\"color:#c9558c;font-weight:700\">{{ windowLabel }}<\u002Fspan>. speech is band-limited to <a href=\"tel:120–5500\">120–5500<\u002Fa> hz, modulated onto the carrier, then bandpassed so only that window survives.<\u002Fp>\n\n          <button sc-camel-on-click=\"{{ squeakFix }}\" style=\"width:100%;font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;font-size:12.5px;background:#fff8fb;border:2px dashed #ffbcda;color:#c9558c;border-radius:14px;padding:11px;cursor:pointer;margin-bottom:14px\">i can still hear a squeak — fix it ♡<\u002Fbutton>\n\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px\">\n            <span style=\"font-size:13px;font-weight:600;color:#6b4055\">speed<\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#e0509a\">{{ speedLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" min=\"1\" max=\"4\" step=\"0.1\" value=\"{{ speed }}\" sc-camel-on-change=\"{{ setSpeed }}\" sc-camel-on-input=\"{{ setSpeed }}\" style=\"width:100%;margin:0 0 14px\">\n\n          <label style=\"display:flex;gap:10px;align-items:flex-start;background:#fff8fb;border:2px solid #ffdcec;border-radius:14px;padding:11px 12px;cursor:pointer\">\n            <input type=\"checkbox\" checked=\"{{ keepAudible }}\" sc-camel-on-change=\"{{ toggleAudible }}\" style=\"margin-top:2px;accent-color:#ff5fa2\">\n            <span style=\"font-size:12.5px;line-height:1.55;color:#6b4055\">keep a soft audible layer underneath <span style=\"color:#b99ab0\">(for testing — leave off for a truly silent sub)<\u002Fspan><\u002Fspan>\n          <\u002Flabel>\n\n          <div style=\"margin-top:16px;display:flex;flex-wrap:wrap;gap:7px\">\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9px;background:#ffeaf4;color:#c9407e;border-radius:999px;padding:6px 10px\">16-bit wav<\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9px;background:#ffeaf4;color:#c9407e;border-radius:999px;padding:6px 10px\">butterworth 8<\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9px;background:#ffeaf4;color:#c9407e;border-radius:999px;padding:6px 10px\">peak 0.88<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:linear-gradient(#fff6fa,#ffeef6);border:3px solid #ffd7e8;border-radius:24px;padding:20px;box-shadow:0 10px 0 rgba(255,183,214,.2)\">\n          <h2 style=\"margin:0 0 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#c9407e\">listen &amp; verify<\u002Fh2>\n          <sc-if value=\"{{ previewUrl }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:11px\">\n              <span style=\"font-size:12.5px;color:#6b4055;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ previewName }}<\u002Fspan>\n              <div style=\"display:flex;gap:6px\">\n                <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ m.pick }}\" style=\"flex:1;font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;font-size:11.5px;background:{{ m.bg }};border:2px solid {{ m.border }};color:{{ m.fg }};border-radius:12px;padding:8px 4px;cursor:pointer;line-height:1.3\">{{ m.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <audio id=\"kk-audio\" ref=\"{{ audioRef }}\" src=\"{{ previewUrl }}\" controls=\"\" loop=\"\" sc-camel-on-play=\"{{ onPlay }}\" sc-camel-on-pause=\"{{ onPause }}\" style=\"width:100%\"><\u002Faudio>\n              <canvas id=\"kk-spectrum\" ref=\"{{ canvasRef }}\" style=\"width:100%;height:132px;border:2px solid #ffdcec;border-radius:14px;background:#fffdfe;display:block\"><\u002Fcanvas>\n              <p style=\"margin:0;font-size:11.5px;color:#b99ab0;line-height:1.55\">press play to watch the spectrum. the green line is your carrier, the box is the window everything should sit inside — if you see pink bars to the left of 12k, that part is audible.<\u002Fp>\n              <p style=\"margin:0;font-size:12px;color:#8d6079;line-height:1.6;background:#fffdfe;border:2px dashed #ffdcec;border-radius:12px;padding:10px 12px\">{{ modeNote }}<\u002Fp>\n\n              <sc-if value=\"{{ canPlay }}\" hint-placeholder-val=\"{{ true }}\">\n                <button sc-camel-on-click=\"{{ togglePlay }}\" style=\"width:100%;font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;font-size:14px;background:#ff5fa2;border:3px solid #ff3d88;color:#fff;border-radius:999px;padding:12px;cursor:pointer;box-shadow:0 4px 0 #ff3d88\">{{ playLabel }}<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ cannotPlay }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"width:100%;box-sizing:border-box;font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;font-size:13px;background:#fff1f2;border:2px dashed #f3b9bd;color:#c26066;border-radius:999px;padding:12px;text-align:center\">loop playback locked — not encoded yet<\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ hasReport }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"background:{{ report.bg }};border:2px solid #ffdcec;border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:9px\">\n                  <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:{{ report.color }}\">{{ report.status }}<\u002Fspan>\n                  <div style=\"display:flex;flex-direction:column;gap:6px\">\n                    <sc-for list=\"{{ report.checks }}\" as=\"c\" hint-placeholder-count=\"6\">\n                      <div style=\"display:grid;grid-template-columns:16px 1fr;gap:8px;align-items:start\">\n                        <span style=\"font-size:12px;font-weight:700;color:{{ c.color }};line-height:1.4\">{{ c.mark }}<\u002Fspan>\n                        <div style=\"display:flex;flex-direction:column;gap:1px;min-width:0\">\n                          <span style=\"font-size:12px;color:#6b4055;font-weight:600;line-height:1.4\">{{ c.name }}<\u002Fspan>\n                          <span style=\"font-family:ui-monospace,monospace;font-size:10.5px;color:#a8809a;line-height:1.5\">{{ c.detail }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:10px;flex-wrap:wrap;font-family:ui-monospace,monospace;font-size:10.5px;color:#a8809a;border-top:1px dashed #ffdcec;padding-top:8px\">\n                    <span>measured {{ report.measured }}<\u002Fspan>\n                    <span>ratio {{ report.ratio }}×<\u002Fspan>\n                    <span>{{ report.window }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noPreview }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;gap:12px;align-items:center\">\n              <img src=\"f7a88090-8c40-4e71-a299-36807a99d207\" alt=\"\" style=\"width:56px;height:56px;object-fit:contain;animation:kk-float 3.6s ease-in-out infinite\">\n              <span style=\"font-size:12.5px;color:#b99ab0;line-height:1.6\">convert something and the finished loop shows up here.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"freqcheck\" style=\"max-width:1080px;margin:0 auto;padding:34px 24px 0;scroll-margin-top:20px\">\n    <div style=\"background:#fff;border:3px solid #ffd7e8;border-radius:24px;padding:24px;box-shadow:0 10px 0 rgba(255,183,214,.2)\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:6px\">\n        <img src=\"f7a88090-8c40-4e71-a299-36807a99d207\" alt=\"\" style=\"width:40px;height:40px;object-fit:contain\">\n        <h2 style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:#c9407e\">frequency check<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 18px;font-size:13.5px;color:#a8809a;line-height:1.65\">drop in any file — one of mine, or a sub you downloaded from someone else — and i'll tell you exactly where its energy lives and whether it really is a 17500 hz sub.<\u002Fp>\n\n      <label style=\"display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px;border:3px dashed #ffbcda;border-radius:18px;background:#fffdfe;cursor:pointer;text-align:center;margin-bottom:18px\">\n        <span style=\"font-weight:700;font-size:14px;color:#c9558c\">choose a file to analyse<\u002Fspan>\n        <span style=\"font-size:12px;color:#ad86a0\">{{ anaName }}<\u002Fspan>\n        <input type=\"file\" accept=\"audio/*,video/mp4,video/webm,.flac,.m4a,.wav,.mp3,.ogg,.opus,.aac\" sc-camel-on-change=\"{{ onAnaPick }}\" style=\"display:none\">\n      <\u002Flabel>\n\n      <sc-if value=\"{{ anaBusy }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"margin:0;font-size:13px;color:#c9558c;font-weight:600;text-align:center\">analysing…<\u002Fp>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ hasAna }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;grid-template-columns:1.3fr .7fr;gap:20px;align-items:start\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <canvas id=\"kk-ana-canvas\" style=\"width:100%;height:170px;border:2px solid #ffdcec;border-radius:14px;display:block\"><\u002Fcanvas>\n            <p style=\"margin:0;font-size:11.5px;color:#b99ab0;line-height:1.55\">log-magnitude spectrum of the whole file. the green line marks 17500 hz — a true sub has all its energy to the right of it and nothing to the left.<\u002Fp>\n            <div style=\"background:#fff8fb;border:2px solid #ffdcec;border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:9px\">\n              <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:#c9407e\">energy by band<\u002Fspan>\n              <sc-for list=\"{{ ana.bands }}\" as=\"b\" hint-placeholder-count=\"6\">\n                <div style=\"display:grid;grid-template-columns:120px 1fr 52px;gap:9px;align-items:center\">\n                  <span style=\"font-size:11.5px;color:#6b4055\">{{ b.name }}<\u002Fspan>\n                  <span style=\"height:9px;background:#ffeaf4;border-radius:999px;display:block;overflow:hidden\">\n                    <span style=\"display:block;height:100%;width:{{ b.width }};background:{{ b.color }};border-radius:999px\"><\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"font-family:ui-monospace,monospace;font-size:10.5px;color:#a8809a;text-align:right\">{{ b.pct }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"background:#fff8fb;border:2px solid #ffdcec;border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:6px\">\n              <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:{{ ana.at17500Color }};line-height:1.6\">{{ ana.at17500 }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#fff8fb;border:2px solid #ffdcec;border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:5px;font-family:ui-monospace,monospace;font-size:11px;color:#7d5a70;line-height:1.6\">\n              <span>sample rate — {{ ana.sr }}<\u002Fspan>\n              <span>nyquist — {{ ana.nyquist }}<\u002Fspan>\n              <span>channels — {{ ana.channels }}<\u002Fspan>\n              <span>length — {{ ana.duration }}<\u002Fspan>\n              <span>energy from — {{ ana.low }}<\u002Fspan>\n              <span>energy to — {{ ana.high }}<\u002Fspan>\n              <span>loudest bin — {{ ana.peakHz }}<\u002Fspan>\n              <span>peak level — {{ ana.peak }}<\u002Fspan>\n              <span>clipped — {{ ana.clip }}<\u002Fspan>\n              <span>dc offset — {{ ana.dc }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"mixer\" style=\"max-width:1080px;margin:0 auto;padding:34px 24px 0;scroll-margin-top:20px\">\n    <div style=\"background:#fff;border:3px solid #ffd7e8;border-radius:24px;padding:24px;box-shadow:0 10px 0 rgba(255,183,214,.2)\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:6px\">\n        <img src=\"b15c97a2-dae5-4c23-8f9f-e39386bdb6af\" alt=\"\" style=\"width:40px;height:40px;object-fit:contain\">\n        <h2 style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:#c9407e\">mix &amp; render<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 18px;font-size:13.5px;color:#a8809a;line-height:1.65\">every file you added upstairs is a track down here. set levels, mute what you don't want, and render them into one file — optionally encoded to 17500 hz on the way out.<\u002Fp>\n\n      <sc-if value=\"{{ hasMixRows }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:9px;margin-bottom:18px\">\n          <sc-for list=\"{{ mixRows }}\" as=\"m\" hint-placeholder-count=\"2\">\n            <div style=\"display:grid;grid-template-columns:1fr 150px 62px 74px;gap:12px;align-items:center;background:#fff8fb;border:2px solid #ffdcec;border-radius:14px;padding:11px 13px;opacity:{{ m.rowOpacity }}\">\n              <span style=\"font-size:13px;font-weight:600;color:#6b4055;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ m.name }}<\u002Fspan>\n              <input type=\"range\" min=\"-30\" max=\"6\" step=\"1\" value=\"{{ m.db }}\" sc-camel-on-change=\"{{ m.setDb }}\" sc-camel-on-input=\"{{ m.setDb }}\" style=\"width:100%\">\n              <span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#a8809a;text-align:right\">{{ m.dbLabel }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ m.toggleMute }}\" style=\"font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;font-size:11.5px;background:{{ m.muteBg }};border:2px solid #ffc2dc;color:{{ m.muteFg }};border-radius:999px;padding:7px 8px;cursor:pointer\">{{ m.muteLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 150px 62px;gap:12px;align-items:center;background:#fff2f8;border:2px solid #ffc2dc;border-radius:14px;padding:11px 13px;margin-bottom:16px\">\n          <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:#c9407e\">master<\u002Fspan>\n          <input type=\"range\" min=\"-24\" max=\"0\" step=\"1\" value=\"{{ mixMasterDb }}\" sc-camel-on-change=\"{{ setMixMaster }}\" sc-camel-on-input=\"{{ setMixMaster }}\" style=\"width:100%\">\n          <span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#a8809a;text-align:right\">{{ mixMasterLabel }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <label style=\"display:flex;gap:10px;align-items:flex-start;background:#fff8fb;border:2px solid #ffdcec;border-radius:14px;padding:11px 12px;cursor:pointer;margin-bottom:16px\">\n          <input type=\"checkbox\" checked=\"{{ mixEncode }}\" sc-camel-on-change=\"{{ toggleMixEncode }}\" style=\"margin-top:2px;accent-color:#ff5fa2\">\n          <span style=\"font-size:12.5px;line-height:1.55;color:#6b4055\">encode the finished mix to 17500 hz <span style=\"color:#b99ab0\">(untick for a plain audible mixdown)<\u002Fspan><\u002Fspan>\n        <\u002Flabel>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n          <button sc-camel-on-click=\"{{ mixRender }}\" style=\"font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;font-size:15px;background:#ff5fa2;border:3px solid #ff3d88;color:#fff;border-radius:999px;padding:13px 28px;cursor:pointer;box-shadow:0 5px 0 #ff3d88\">render mix<\u002Fbutton>\n          <sc-if value=\"{{ mixBusy }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"display:flex;align-items:center;gap:9px;font-size:13px;color:#c9558c;font-weight:600\">\n              <span style=\"width:16px;height:16px;border:3px solid #ffd7e8;border-top-color:#ff5fa2;border-radius:999px;display:inline-block;animation:kk-spin .8s linear infinite\"><\u002Fspan>\n              {{ busyLabel }}\n            <\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasMix }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\">\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;line-height:1.6;color:{{ mixVerdictColor }}\">{{ mixVerdict }}<\u002Fspan>\n            <audio src=\"{{ mixUrl }}\" controls=\"\" loop=\"\" style=\"width:100%\"><\u002Faudio>\n            <a href=\"{{ mixUrl }}\" download=\"kiki_mix.wav\" style=\"align-self:flex-start;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;background:#ff6faa;border:2px solid #ff4d94;color:#fff;border-radius:999px;padding:9px 16px;box-shadow:0 3px 0 #ff4d94\">save the mix<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noMixRows }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"margin:0;font-size:13px;color:#b99ab0;background:#fff8fb;border:2px dashed #ffdcec;border-radius:16px;padding:16px;text-align:center\">add some files in the converter above and they'll appear here as tracks ♡<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"resample\" style=\"max-width:1080px;margin:0 auto;padding:34px 24px 0;scroll-margin-top:20px\">\n    <div style=\"background:#fff;border:3px solid #ffd7e8;border-radius:24px;padding:24px;box-shadow:0 10px 0 rgba(255,183,214,.2)\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:6px\">\n        <img src=\"b0cde584-7e8a-40b6-aaa1-d4727eeabd1f\" alt=\"\" style=\"width:40px;height:40px;object-fit:contain\">\n        <h2 style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:#c9407e\">sample rate converter<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 18px;font-size:13.5px;color:#a8809a;line-height:1.65\">plain resampling, nothing else — no encoding, no filtering. pick a file, pick a rate and bit depth, and download the wav. same job as audacity's project rate box plus export.<\u002Fp>\n\n      <label style=\"display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px;border:3px dashed #ffbcda;border-radius:18px;background:#fffdfe;cursor:pointer;text-align:center;margin-bottom:18px\">\n        <span style=\"font-weight:700;font-size:14px;color:#c9558c\">choose a file to convert<\u002Fspan>\n        <span style=\"font-size:12px;color:#ad86a0\">{{ rsName }}<\u002Fspan>\n        <input type=\"file\" accept=\"audio/*,video/mp4,video/webm,.flac,.m4a,.wav,.mp3,.ogg,.opus,.aac\" sc-camel-on-change=\"{{ onRsPick }}\" style=\"display:none\">\n      <\u002Flabel>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div>\n            <span style=\"font-size:13px;font-weight:600;color:#6b4055;display:block;margin-bottom:8px\">target sample rate<\u002Fspan>\n            <div style=\"display:flex;gap:8px\">\n              <sc-for list=\"{{ rsRates }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ r.pick }}\" style=\"flex:1;display:flex;flex-direction:column;gap:2px;align-items:center;font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;background:{{ r.bg }};border:2px solid {{ r.border }};color:{{ r.fg }};border-radius:14px;padding:11px 4px;cursor:pointer\">\n                  <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px\">{{ r.label }}<\u002Fspan>\n                  <span style=\"font-size:10px;font-weight:600;color:{{ r.subFg }}\">{{ r.sub }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <span style=\"font-size:13px;font-weight:600;color:#6b4055;display:block;margin-bottom:8px\">bit depth<\u002Fspan>\n            <div style=\"display:flex;gap:8px\">\n              <sc-for list=\"{{ rsDepths }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ d.pick }}\" style=\"flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;background:{{ d.bg }};border:2px solid {{ d.border }};color:{{ d.fg }};border-radius:12px;padding:10px 4px;cursor:pointer\">{{ d.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:11.5px;color:#b99ab0;line-height:1.55\">upsampling never adds detail that wasn't recorded — it just gives later processing more headroom. 48000 is the right default for subs; 96000 if you plan to keep editing.<\u002Fp>\n        <\u002Fdiv>\n\n        <div>\n          <sc-if value=\"{{ rsBusy }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"display:flex;align-items:center;gap:9px;font-size:13px;color:#c9558c;font-weight:600\">\n              <span style=\"width:16px;height:16px;border:3px solid #ffd7e8;border-top-color:#ff5fa2;border-radius:999px;display:inline-block;animation:kk-spin .8s linear infinite\"><\u002Fspan>\n              converting…\n            <\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasRs }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:11px\">\n              <div style=\"background:#fff8fb;border:2px solid #ffdcec;border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:5px;font-family:ui-monospace,monospace;font-size:11px;color:#7d5a70;line-height:1.6\">\n                <span>source rate — {{ rsInfo.from }}<\u002Fspan>\n                <span>output rate — {{ rsInfo.to }} ({{ rsInfo.change }})<\u002Fspan>\n                <span>format der }};color:{{ s.fg }};border-radius:999px;padding:8px 15px;cursor:pointer\">{{ s.name }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start\">\n        <div>\n          <p style=\"margin:0 0 10px;font-size:13px;color:#6b4055;line-height:1.7;background:#fff8fb;border:2px dashed #ffdcec;border-radius:14px;padding:12px 14px\">{{ styleNote }}<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ starters }}\" as=\"st\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ st.add }}\" style=\"text-align:left;font-family:Trebuchet MS,Verdana,sans-serif;font-size:13px;color:#6b4055;background:#fff;border:2px solid #ffdcec;border-radius:14px;padding:10px 13px;cursor:pointer;line-height:1.5\" style-hover=\"border-color:#ff8fbf;background:#fff6fa\">+ {{ st.text }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <textarea value=\"{{ script }}\" sc-camel-on-change=\"{{ setScript }}\" placeholder=\"i am her. it already happened. my desires come to me easily…\" style=\"width:100%;box-sizing:border-box;min-height:220px;resize:vertical;font-family:Trebuchet MS,Verdana,sans-serif;font-size:14px;line-height:1.75;color:#5a3346;background:#fff8fb;border:2px solid #ffdcec;border-radius:16px;padding:14px\"><\u002Ftextarea>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n            <button sc-camel-on-click=\"{{ speak }}\" style=\"font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;font-size:13.5px;background:#ff6faa;border:2px solid #ff4d94;color:#fff;border-radius:999px;padding:10px 20px;cursor:pointer;box-shadow:0 4px 0 #ff4d94\">{{ speakLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ downloadScript }}\" style=\"font-family:Trebuchet MS,Verdana,sans-serif;font-weight:700;font-size:13.5px;background:#fff;border:2px solid #ffc2dc;color:#c9558c;border-radius:999px;padding:10px 20px;cursor:pointer\">save as .txt<\u002Fbutton>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:#c9558c\">{{ lineCount }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"askkiki\" style=\"max-width:1080px;margin:0 auto;padding:34px 24px 0;scroll-margin-top:20px\">\n    <div style=\"display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start\">\n      <div style=\"background:#fff;border:3px solid #ffd7e8;border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 10px 0 rgba(255,183,214,.2)\">\n        <img src=\"a013bd12-0202-4ee6-99e2-b280a35a7233\" alt=\"Kiki\" style=\"width:150px;height:150px;object-fit:contain;animation:kk-float 3.8s ease-in-out infinite\">\n        <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#e0509a\">ask kiki<\u002Fspan>\n        <p style=\"margin:0;font-size:12px;color:#a8809a;text-align:center;line-height:1.6\">she has been making subs for six years. tap anything ♡<\u002Fp>\n        <div style=\"display:flex;gap:6px;margin-top:2px\">\n          <span style=\"width:7px;height:7px;background:#ffb3d4;border-radius:999px;display:inline-block;animation:kk-twinkle 1.6s ease-in-out infinite\"><\u002Fspan>\n          <span style=\"width:7px;height:7px;background:#ffb3d4;border-radius:999px;display:inline-block;animation:kk-twinkle 1.6s ease-in-out .3s infinite\"><\u002Fspan>\n          <span style=\"width:7px;height:7px;background:#ffb3d4;border-radius:999px;display:inline-block;animation:kk-twinkle 1.6s ease-in-out .6s infinite\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <sc-for list=\"{{ questions }}\" as=\"q\" hint-placeholder-count=\"8\">\n            <button sc-camel-on-click=\"{{ q.pick }}\" style=\"font-family:Trebuchet MS,Verdana,sans-serif;font-weight:600;font-size:12.5px;background:{{ q.bg }};border:2px solid {{ q.border }};color:{{ q.fg }};border-radius:999px;padding:9px 15px;cursor:pointer;text-align:left\">{{ q.text }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:3px solid #ffd7e8;border-radius:24px;padding:22px 24px;box-shadow:0 10px 0 rgba(255,183,214,.2)\">\n          <h3 style=\"margin:0 0 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;color:#c9407e\">{{ answer.q }}<\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:11px;font-size:14.5px;line-height:1.78;color:#6b4055;text-wrap:pretty\">\n            <sc-for list=\"{{ answer.a }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <p style=\"margin:0\">{{ p }}<\u002Fp>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"max-width:1080px;margin:0 auto;padding:38px 24px 0;text-align:center\">\n    <img src=\"b0cde584-7e8a-40b6-aaa1-d4727eeabd1f\" alt=\"\" style=\"width:44px;height:44px;object-fit:contain;animation:kk-bob 3.4s ease-in-out infinite\">\n    <p style=\"margin:8px 0 0;font-size:11.5px;color:#c2a3b7;line-height:1.7\">made with kiki ♡ everything runs locally in your browser · subliminals are a mindset practice, not medical advice<\u002Fp>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startFrequency&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:17500,&quot;min&quot;:14000,&quot;max&quot;:19500,&quot;step&quot;:100,&quot;unit&quot;:&quot;Hz&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Audio&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ff5fa2&quot;,&quot;options&quot;:[&quot;#ff5fa2&quot;,&quot;#ff8fbf&quot;,&quot;#e0509a&quot;,&quot;#ff4d94&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;}}\">\nconst STEPS = [\n  {title:\"hi hi ♡ i'm kiki!\", lines:[\"i make subliminals — and this little studio is where i turn my affirmation recordings into the quiet kind you can loop all night.\",\"let me show you around real quick. it takes like thirty seconds, promise.\"], tip:\"if you already know the drill, hit skip and go play.\"},\n  {title:\"what 17500 hz actually means\", lines:[\"your voice normally sits between about 100 and 3000 hz. that's the range your ears grab onto.\",\"this studio lifts your recording up onto a 17500 hz carrier. the words are all still there in the file — they've just been moved to the very top edge of human hearing, where your conscious mind stops paying attention.\",\"that's why a finished sub sounds like near-silence. it isn't empty. it's just polite.\"], tip:\"headphones or a decent speaker help — tinny phone speakers roll off the high end.\"},\n  {title:\"sample rate vs carrier\", lines:[\"sample rate is how many snapshots per second the file holds — it's the 'project rate' box in audacity. carrier is where your voice gets parked inside that.\",\"a 44100 hz file can only carry sound up to 22050 hz, and things get crunchy near the ceiling. 48000 is the sweet default; there's a 96000 option too if you want loads of headroom.\",\"drop in mp3, wav, mp4, m4a, aac, alac, flac, ogg, opus — whatever you've got. it all comes back as one tidy 16-bit wav at the rate you picked.\"], tip:\"after converting, hit 'hear it decoded' — that plays the ultrasonic band back in hearing range so you can check your words are really in there.\"},\n  {title:\"how i actually use it\", lines:[\"record your affirmations in your own voice. your voice is the one your subconscious already trusts.\",\"bring it here, hit convert, then loop the export while you sleep, study, scroll — anything. eight-ish hours a night is my normal.\",\"layer it under music if you like. the 17500 hz version sits above the music, so nothing fights.\"], tip:\"one sub at a time, at least at first. give it a clean run.\"},\n  {title:\"the part that matters most\", lines:[\"the audio is the delivery. the assumption is the work.\",\"you're not begging the universe. you're deciding it's already done and letting your mind catch up to that. the loop just keeps whispering the new story until it's the boring, obvious truth.\",\"go on then. i put a whole affirmation writer downstairs, and you can ask me anything in the ask kiki bit ♡\"], tip:\"come back to this tutorial anytime — it's the pink button up top.\"}\n];\n\nconst STYLES = [\n  {name:\"affirmations\", note:\"straight declarations in the present tense. you're not asking, you're stating. keep them short enough to say in one breath so they're easy to repeat and easy to believe.\", starters:[\"i am the girl everything works out for.\",\"my desires come to me easily and quickly.\",\"i am safe, i am chosen, i am adored.\",\"everything i want already belongs to me.\",\"people are naturally drawn to me.\"]},\n  {name:\"afformations\", note:\"questions instead of statements. asking 'why' makes your mind go looking for evidence instead of arguing with you — it slips past the part of you that wants to say 'no it isn't'.\", starters:[\"why is it so easy for me to be loved?\",\"why do good things keep finding me?\",\"why does money always arrive right on time?\",\"why am i the exception to every rule?\",\"why did this work out even better than i imagined?\"]},\n  {name:\"time related\", note:\"affirmations with a clock attached. they tell your subconscious that this is fast, not someday — and they give you something to notice, which builds belief.\", starters:[\"my results show up faster every single day.\",\"this manifests within days, not months.\",\"i see proof of this within 24 hours.\",\"every hour i sleep, this moves closer.\",\"i wake up tomorrow already in the new version.\"]},\n  {name:\"identity ♡\", note:\"the deepest layer. instead of affirming a thing you get, you affirm the person you already are. change the self-concept and the circumstances follow it around.\", starters:[\"this is simply who i am now.\",\"i've always been her.\",\"i don't chase, i choose.\",\"my presence changes the room.\",\"of course this is my life.\"]}\n];\n\nconst QA = [\n  {q:\"how do i actually get subliminal results?\", a:[\n    \"consistency, then patience, in that order. pick one sub, loop it daily, and stop rotating — every time you swap you restart the conversation.\",\n    \"listen while your mind is soft: falling asleep, waking up, walking, in the shower. that's when you're least busy arguing back.\",\n    \"and then act like it's done. affirm in the morning, then go about your day as the person who already has it. results follow the assumption, not the volume knob.\"]},\n  {q:\"what makes a good affirmation?\", a:[\n    \"present tense, first person, no negatives. your mind doesn't really hear 'not' — say 'my skin is clear', never 'my skin isn't breaking out'.\",\n    \"short and repeatable beats poetic. if you can't say it in one breath you won't say it a thousand times.\",\n    \"and it has to feel a little bit true when you say it. if it feels like a lie, soften it — 'i'm becoming' is a real step on the way to 'i am'.\"]},\n  {q:\"what are afformations, and why do they work?\", a:[\n    \"afformations are affirmations turned into questions. 'why is money so easy for me?' instead of 'money is easy for me'.\",\n    \"the trick is what a question does to your brain. a statement invites a rebuttal. a question sends your mind hunting for evidence — and it will find some, because it always does.\",\n    \"i like mixing them in when i'm affirming something my logical mind still wants to fight about.\"]},\n  {q:\"what about time related affirmations?\", a:[\n    \"these are the ones with urgency built in: 'this manifests within days', 'i see proof within 24 hours', 'my results speed up every night'.\",\n    \"they do two things. they remove 'someday' — which is really just a polite way of saying never — and they make you look for evidence soon, which builds belief fast.\",\n    \"don't panic if a deadline passes. you're setting a tone, not signing a contract. just keep going.\"]},\n  {q:\"what is the subconscious mind doing with all this?\", a:[\n    \"think of the subconscious as the part running everything you don't think about: habits, reflexes, what you assume is possible for you. it doesn't debate, it just accepts what it hears often enough.\",\n    \"repetition is how anything moves from your conscious mind into that layer. it's the same mechanism as a song you never chose to memorise but somehow know every word of.\",\n    \"that's the whole idea behind subliminals. keep the new story playing under the surface, quietly, until it stops being new and becomes the assumption you operate from.\"]},\n  {q:\"3d, 4d — what do those mean?\", a:[\n    \"the 3d is the physical world: the mirror, the bank app, the texts you got today. it's the last thing to update, so it's the worst place to look for reassurance.\",\n    \"the 4d is the inner one: your imagination, your assumptions, how it already feels to have it. in the law of assumption this is the causal side — you change it here first.\",\n    \"so when the 3d hasn't moved yet, don't renegotiate with it. go back to the 4d, live there for a few minutes, and let the loop keep running.\"]},\n  {q:\"how long should i listen, and how loud?\", a:[\n    \"an hour minimum, eight overnight if you can. i loop mine all night and honestly forget it's on.\",\n    \"volume should be gentle — around where you'd set quiet background music. loud does not mean faster, and your ears matter more than your manifestation.\",\n    \"if you get a headache or feel wired, take a day off. that's not the sub failing, that's just too much input.\"]},\n  {q:\"do i have to believe it for it to work?\", a:[\n    \"no. you have to stop actively contradicting it, which is different and much easier.\",\n    \"belief isn't a switch, it's a slope. you go from 'no way' to 'maybe' to 'obviously' — and repetition is what walks you up it.\",\n    \"so don't wait to feel certain. loop it anyway, act as if, and let the certainty arrive late. it usually does.\"]}\n];\n\nclass Component extends DCLogic {\n  state = {\n    tutorialOpen: true, step: 0, tracks: [], busy: false, busyLabel: \"\",\n    sampleRate: 48000, carrier: 17500, offset: 0, depth: 0.5, outDb: -6,\n    engine: \"ssb\", speed: 1, keepAudible: false, playing: false, verdictId: \"\",\n    dragging: false, previewId: \"\", previewMode: \"encoded\",\n    anaName: \"\", anaBusy: false, anaResult: null,\n    rsName: \"\", rsBusy: false, rsRate: 48000, rsDepth: 16, rsUrl: \"\", rsInfo: null,\n    mixGain: {}, mixMute: {}, mixMasterDb: -3, mixEncode: true,\n    mixBusy: false, mixUrl: \"\", mixReport: null,\n    styleIdx: 0, script: \"\", speaking: false, qIdx: 0\n  };\n\n  componentDidMount() {\n    // the dc runtime strips <template> children, so fill the publish splash at runtime\n    const tpl = document.getElementById(\"__bundler_thumbnail\");\n    if (tpl && !tpl.innerHTML.trim()) {\n      tpl.innerHTML = '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\">' +\n        '<rect width=\"200\" height=\"200\" fill=\"#fffafc\"><\u002Frect>' +\n        '<circle cx=\"100\" cy=\"100\" r=\"46\" fill=\"#ffe0ee\"><\u002Fcircle>' +\n        '<path d=\"M100 76c-9-13-30-9-30 8 0 13 18 24 30 32 12-8 30-19 30-32 0-17-21-21-30-8z\" fill=\"#ff5fa2\"><\u002Fpath>' +\n        '<text x=\"100\" y=\"152\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"17\" fill=\"#c9407e\">17500<\u002Ftext>' +\n        '<\u002Fsvg>';\n    }\n    try {\n      if
